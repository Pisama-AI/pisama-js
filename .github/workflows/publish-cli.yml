name: Publish CLI to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test with coverage gates
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit:production
      - name: Audit bundled dependency inputs
        run: pnpm audit:bundle-inputs
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Pack publish artifact
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/release"
          (
            cd "$RUNNER_TEMP/release"
            sha256sum pisama-cli-*.tgz > SHA256SUMS
          )
      - name: Verify publish artifact
        env:
          AUDIT_CLI_ARTIFACT: "1"
        run: >-
          ./scripts/verify-cli-artifact.sh
          "$RUNNER_TEMP"/release/pisama-cli-*.tgz
          "$(node -p "require('./packages/cli/package.json').version")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Record build provenance for the exact tarball.
      contents: read
      id-token: write # Authenticate the GitHub attestation with OIDC.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: dist/
      - name: Verify artifact checksum
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest publish artifact
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: dist/*.tgz

  publish:
    name: Publish and verify registry
    needs: attest
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    permissions:
      contents: read
      id-token: write # Authenticate npm trusted publishing with OIDC.
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: dist/
      - name: Verify promoted artifact checksum
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Select npm dist-tag
        id: dist
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      # PR #24 removed `registry-url` from this job's setup-node: with no token supplied,
      # setup-node still writes the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX` as
      # `_authToken`, so npm authenticated with garbage instead of attempting OIDC.
      # That fix is kept. This step writes a real token and only when one is configured,
      # so with no NPM_TOKEN secret it is skipped and the OIDC path is byte-for-byte
      # unchanged. A classic "Publish" token will NOT work here: those still require an
      # OTP (verified 2026-07-28, `npm dist-tag add` returned EOTP), and CI cannot answer
      # one. Use a granular or automation token.
      - name: Enable token auth when NPM_TOKEN is configured
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
      - name: Publish through npm trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: >-
          npm publish ./dist/pisama-cli-*.tgz
          --access public
          --provenance
          --tag "$NPM_DIST_TAG"
      - name: Verify public registry release
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
          VERSION: ${{ steps.dist.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] This intentionally tests a fresh registry resolution.
          published=false
          for attempt in {1..12}; do
            if [[ "$(npm view "@pisama/cli@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              published=true
              break
            fi
            echo "Waiting for @pisama/cli@$VERSION to reach npm ($attempt/12)"
            sleep 5
          done
          test "$published" = true
          test "$(npm view "@pisama/cli" "dist-tags.$DIST_TAG")" = "$VERSION"

          # The attestations endpoint indexes separately from (and observed
          # slower than) the base package publish above, so both attestation
          # reads below get their own retry loop instead of a single check.
          # 2026-07-30: this is what actually 404's when it races the base
          # publish, first on this field and then on `npm audit signatures`.
          provenance_ok=false
          for attempt in {1..12}; do
            if [[ "$(npm view "@pisama/cli@$VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)" == "https://slsa.dev/provenance/v1" ]]; then
              provenance_ok=true
              break
            fi
            echo "Waiting for @pisama/cli@$VERSION provenance attestation to reach npm ($attempt/12)"
            sleep 5
          done
          test "$provenance_ok" = true

          install_dir=$(mktemp -d)
          trap 'rm -rf -- "$install_dir"' EXIT
          npm install --ignore-scripts --prefix "$install_dir" "@pisama/cli@$VERSION"
          test "$("$install_dir/node_modules/.bin/pisama" --version)" = "$VERSION"
          test "$("$install_dir/node_modules/.bin/pisama-ts" --version)" = "$VERSION"
          npm audit --omit=dev --audit-level=moderate --prefix "$install_dir"

          signatures_ok=false
          for attempt in {1..12}; do
            if npm audit signatures --prefix "$install_dir"; then
              signatures_ok=true
              break
            fi
            echo "Waiting for @pisama/cli@$VERSION attestations to reach npm audit signatures ($attempt/12)"
            sleep 5
          done
          test "$signatures_ok" = true
