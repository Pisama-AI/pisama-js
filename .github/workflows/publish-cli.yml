name: Publish CLI to npm

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test with coverage gates
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit:production
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Pack and inspect publish artifact
        run: pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP"
      - name: Verify publish artifact
        run: |
          install_dir=$(mktemp -d)
          npm install --ignore-scripts --prefix "$install_dir" "$RUNNER_TEMP"/pisama-cli-*.tgz
          test "$("$install_dir/node_modules/.bin/pisama" --version)" = "$(node -p "require('./packages/cli/package.json').version")"
          test -f "$install_dir/node_modules/@pisama/cli/THIRD_PARTY_NOTICES.md"
          npm audit --omit=dev --audit-level=moderate --prefix "$install_dir"
      - name: Publish through npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/pisama-cli-*.tgz --access public
