name: Stage @whoopsie/cli retirement on npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @whoopsie/cli retirement version already committed and tagged
        required: true
        type: string
      expected_sha256:
        description: Independently reviewed lowercase SHA-256 of whoopsie-cli-<version>.tgz
        required: true
        type: string
      git_tag:
        description: Existing immutable tag (whoopsie-cli-v<version>)
        required: true
        type: string
      dist_tag:
        description: Dist-tag applied only if the npm stage is later approved
        required: true
        default: migration
        type: choice
        options: [migration, latest]

permissions:
  contents: read

concurrency:
  group: npm-stage-whoopsie-cli-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify one immutable artifact
    if: ${{ github.ref == format('refs/tags/{0}', inputs.git_tag) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-npm-stage
        with:
          package-name: '@whoopsie/cli'
          package-dir: packages/whoopsie-cli
          artifact-stem: whoopsie-cli
          version: ${{ inputs.version }}
          expected-sha256: ${{ inputs.expected_sha256 }}
          git-tag: ${{ inputs.git_tag }}
          tag-prefix: whoopsie-cli-v
          event-ref: ${{ github.ref }}
          event-sha: ${{ github.sha }}
          artifact-name: npm-stage-whoopsie-cli-${{ github.run_id }}

  stage:
    name: OIDC stage only (human 2FA approval remains separate)
    if: ${{ github.ref == format('refs/tags/{0}', inputs.git_tag) }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/stage-npm-package
        with:
          package-name: '@whoopsie/cli'
          package-dir: packages/whoopsie-cli
          version: ${{ inputs.version }}
          expected-sha256: ${{ inputs.expected_sha256 }}
          git-tag: ${{ inputs.git_tag }}
          tag-prefix: whoopsie-cli-v
          event-ref: ${{ github.ref }}
          event-sha: ${{ github.sha }}
          dist-tag: ${{ inputs.dist_tag }}
          artifact-name: npm-stage-whoopsie-cli-${{ github.run_id }}
