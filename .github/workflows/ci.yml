name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-reproduction:
    # Read-only reproduction. No environment, OIDC, tag, or npm stage access.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.13"
      - name: Reproduce the reviewed release artifacts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test:coverage
          pnpm audit:production
          pnpm audit:bundle-inputs
          AUDIT_PACKED_CONSUMER=1 ./scripts/verify-packed-consumer.sh "$RUNNER_TEMP/reviewed-release"
          (cd "$RUNNER_TEMP/reviewed-release" && sha256sum --check "$GITHUB_WORKSPACE/scripts/reviewed-release-sha256.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-release-reproduction
          path: ${{ runner.temp }}/reviewed-release/*.tgz
          if-no-files-found: error
          retention-days: 30

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit:production
      - run: pnpm audit:bundle-inputs
      - name: Verify packed packages in a clean Node 24 consumer
        env:
          AUDIT_PACKED_CONSUMER: "1"
        run: ./scripts/verify-packed-consumer.sh "$RUNNER_TEMP/release"

  node-20-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify packed packages in a clean Node 20 consumer
        run: ./scripts/verify-packed-consumer.sh "$RUNNER_TEMP/release"
