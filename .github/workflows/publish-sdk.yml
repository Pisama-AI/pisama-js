name: Stage @pisama/sdk on npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @pisama/sdk version already committed and tagged
        required: true
        type: string
      expected_sha256:
        description: Independently reviewed lowercase SHA-256 of pisama-sdk-<version>.tgz
        required: true
        type: string
      git_tag:
        description: Existing immutable tag (v<version>)
        required: true
        type: string
      dist_tag:
        description: Dist-tag applied only if the npm stage is later approved
        required: true
        default: next
        type: choice
        options: [next, latest]

permissions:
  contents: read

concurrency:
  group: npm-stage-pisama-sdk-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify one immutable artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.git_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-npm-stage
        with:
          package-name: '@pisama/sdk'
          package-dir: packages/sdk
          artifact-stem: pisama-sdk
          version: ${{ inputs.version }}
          expected-sha256: ${{ inputs.expected_sha256 }}
          git-tag: ${{ inputs.git_tag }}
          tag-prefix: v
          artifact-name: npm-stage-pisama-sdk-${{ github.run_id }}

  stage:
    name: OIDC stage only (human 2FA approval remains separate)
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.git_tag }}
          persist-credentials: false
      - uses: ./.github/actions/stage-npm-package
        with:
          package-name: '@pisama/sdk'
          package-dir: packages/sdk
          version: ${{ inputs.version }}
          expected-sha256: ${{ inputs.expected_sha256 }}
          dist-tag: ${{ inputs.dist_tag }}
          artifact-name: npm-stage-pisama-sdk-${{ github.run_id }}
