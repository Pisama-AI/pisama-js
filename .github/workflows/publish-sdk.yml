name: Publish SDK to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test with coverage gates
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit:production
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Pack publish artifact
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --dir packages/detectors pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --dir packages/sdk pack --pack-destination "$RUNNER_TEMP/release"
      - name: Verify publish artifact
        run: |
          install_dir=$(mktemp -d)
          npm install --ignore-scripts --prefix "$install_dir" \
            "$RUNNER_TEMP"/release/pisama-detectors-*.tgz \
            "$RUNNER_TEMP"/release/pisama-sdk-*.tgz
          test -f "$install_dir/node_modules/@pisama/sdk/dist/index.d.ts"
          (
            cd "$install_dir"
            EXPECTED_VERSION=$(node -p "require('./node_modules/@pisama/sdk/package.json').version") \
              node --input-type=module - <<'NODE'
          const sdk = await import('@pisama/sdk');
          if (typeof sdk.observe !== 'function' || sdk.SDK_VERSION !== process.env.EXPECTED_VERSION) {
            throw new Error('packed @pisama/sdk public API or version is incomplete');
          }
          NODE
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ runner.temp }}/release/*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: dist/
      - name: Select npm dist-tag
        id: dist
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      # PR #24 removed `registry-url` from this job's setup-node: with no token supplied,
      # setup-node still writes the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX` as
      # `_authToken`, so npm authenticated with garbage instead of attempting OIDC.
      # That fix is kept. This step writes a real token and only when one is configured,
      # so with no NPM_TOKEN secret it is skipped and the OIDC path is byte-for-byte
      # unchanged. A classic "Publish" token will NOT work here: those still require an
      # OTP (verified 2026-07-28, `npm dist-tag add` returned EOTP), and CI cannot answer
      # one. Use a granular or automation token.
      - name: Enable token auth when NPM_TOKEN is configured
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
      - name: Publish through npm trusted publishing
        run: npm publish ./dist/pisama-sdk-*.tgz --access public --provenance --tag "${{ steps.dist.outputs.tag }}"
      - name: Verify public registry release
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: | # zizmor: ignore[adhoc-packages] Intentionally tests a fresh registry resolution.
          VERSION="${GITHUB_REF_NAME#v}"
          published=false
          for attempt in {1..12}; do
            if [[ "$(npm view "@pisama/sdk@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              published=true
              break
            fi
            echo "Waiting for @pisama/sdk@$VERSION to reach npm ($attempt/12)"
            sleep 5
          done
          test "$published" = true
          test "$(npm view "@pisama/sdk" "dist-tags.$DIST_TAG")" = "$VERSION"
          test \
            "$(npm view "@pisama/sdk@$VERSION" dist.attestations.provenance.predicateType)" \
            = "https://slsa.dev/provenance/v1"

          install_dir=$(mktemp -d)
          trap 'rm -rf -- "$install_dir"' EXIT
          npm install --ignore-scripts --prefix "$install_dir" "@pisama/sdk@$VERSION"
          node -e "
            const m = require('$install_dir/node_modules/@pisama/sdk/package.json');
            for (const [d, spec] of Object.entries(m.dependencies || {})) {
              if (String(spec).startsWith('workspace:')) {
                throw new Error('published tarball leaked a workspace specifier: ' + d + '@' + spec);
              }
            }
          "
