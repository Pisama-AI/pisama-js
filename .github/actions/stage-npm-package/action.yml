name: Stage one npm package through OIDC
description: Verify one immutable artifact and stage it; never approves the staged release.

inputs:
  package-name:
    required: true
    description: Exact existing public npm package name.
  package-dir:
    required: true
    description: Exact checked-out package directory used as npm's working directory.
  version:
    required: true
    description: Exact immutable package version.
  expected-sha256:
    required: true
    description: Independently reviewed lowercase SHA-256 of the exact tarball.
  git-tag:
    required: true
    description: Exact immutable tag selected by the dispatch.
  tag-prefix:
    required: true
    description: Package-specific tag prefix.
  event-ref:
    required: true
    description: Immutable tag ref that triggered workflow_dispatch.
  event-sha:
    required: true
    description: Commit SHA bound to the triggering workflow run.
  dist-tag:
    required: true
    description: npm dist-tag to apply if a human later approves the stage.
  artifact-name:
    required: true
    description: Actions artifact produced by the build job.

runs:
  using: composite
  steps:
    - name: Reverify immutable source identity
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ inputs.git-tag }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        EVENT_REF: ${{ inputs.event-ref }}
        EVENT_SHA: ${{ inputs.event-sha }}
      run: |
        set -euo pipefail
        test "$RELEASE_TAG" = "$TAG_PREFIX$RELEASE_VERSION"
        test "$EVENT_REF" = "refs/tags/$RELEASE_TAG"
        test "$(git rev-parse HEAD)" = "$EVENT_SHA"
        test "$(git rev-parse "$RELEASE_TAG^{}")" = "$EVENT_SHA"
        test "$(git tag --points-at "$EVENT_SHA" --list "$RELEASE_TAG")" = "$RELEASE_TAG"
        git merge-base --is-ancestor "$EVENT_SHA" origin/main
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.14.0
        package-manager-cache: false
    - name: Pin npm with staged-publish support
      shell: bash
      run: |
        set -euo pipefail
        test -z "${NPM_TOKEN:-}"
        test -z "${NODE_AUTH_TOKEN:-}"
        if env | grep -Eiq '^(npm_config_.*(auth|token|password|username)|npm_token|node_auth_token)='; then
          echo 'environment contains npm credential configuration; refusing npm bootstrap' >&2
          exit 1
        fi
        user_config=$(npm config get userconfig)
        global_config=$(npm config get globalconfig)
        while IFS= read -r -d '' npmrc; do
          if [[ ! -f "$npmrc" ]]; then
            echo "npm config path is not a readable file: $npmrc" >&2
            exit 1
          fi
          if grep -Eiq '(^|[:/])(_auth|_authToken|_password|username)[[:space:]]*=' "$npmrc"; then
            echo "npm config contains credential material before bootstrap: $npmrc" >&2
            exit 1
          fi
        done < <(
          {
            [[ -f "$user_config" ]] && printf '%s\0' "$user_config"
            [[ -f "$global_config" ]] && printf '%s\0' "$global_config"
            find "$GITHUB_WORKSPACE" \
              \( -path '*/.git' -o -path '*/node_modules' \) -prune -o \
              -name .npmrc -print0
          }
        )
        npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org/
        test "$(npm --version)" = 11.19.1
        node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/stage-target
    - name: Verify digest, metadata, and credential boundary
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        RELEASE_VERSION: ${{ inputs.version }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
        (
          cd "$RUNNER_TEMP/stage-target"
          sha256sum --check SHA256SUMS
        )
        artifact_count=$(find "$RUNNER_TEMP/stage-target" -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')
        test "$artifact_count" = 1
        artifact=$(find "$RUNNER_TEMP/stage-target" -maxdepth 1 -name '*.tgz' -type f)
        test "$(sha256sum "$artifact" | awk '{print $1}')" = "$EXPECTED_SHA256"
        manifest=$(mktemp)
        trap 'rm -f -- "$manifest"' EXIT
        tar -xOf "$artifact" package/package.json > "$manifest"
        node - "$manifest" "$PACKAGE_NAME" "$RELEASE_VERSION" "$PACKAGE_DIR" <<'NODE'
        const { readFileSync } = require('node:fs');
        const [manifestPath, expectedName, expectedVersion, expectedDirectory] = process.argv.slice(2);
        const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
        if (manifest.name !== expectedName || manifest.version !== expectedVersion) {
          throw new Error('packed name/version differs from the approved dispatch');
        }
        if (
          manifest.repository?.url !== 'https://github.com/Pisama-AI/pisama-js' ||
          manifest.repository?.directory !== expectedDirectory
        ) {
          throw new Error('packed repository metadata is not the exact public source');
        }
        if (
          manifest.publishConfig?.access !== 'public' ||
          manifest.publishConfig?.registry !== 'https://registry.npmjs.org'
        ) {
          throw new Error('packed publish configuration is not the exact public registry');
        }
        for (const spec of Object.values(manifest.dependencies ?? {})) {
          if (String(spec).startsWith('workspace:')) throw new Error('packed workspace specifier');
        }
        NODE
        test -z "${NPM_TOKEN:-}"
        test -z "${NODE_AUTH_TOKEN:-}"
        if env | grep -Eiq '^(npm_config_.*(auth|token|password|username)|npm_token|node_auth_token)='; then
          echo 'environment contains npm credential configuration; refusing OIDC stage' >&2
          exit 1
        fi
        user_config=$(npm config get userconfig)
        global_config=$(npm config get globalconfig)
        while IFS= read -r -d '' npmrc; do
          if [[ ! -f "$npmrc" ]]; then
            echo "npm config path is not a readable file: $npmrc" >&2
            exit 1
          fi
          if grep -Eiq '(^|[:/])(_auth|_authToken|_password|username)[[:space:]]*=' "$npmrc"; then
            echo "npm config contains credential material: $npmrc" >&2
            exit 1
          fi
        done < <(
          {
            [[ -f "$user_config" ]] && printf '%s\0' "$user_config"
            [[ -f "$global_config" ]] && printf '%s\0' "$global_config"
            find "$GITHUB_WORKSPACE" \
              \( -path '*/.git' -o -path '*/node_modules' \) -prune -o \
              -name .npmrc -print0
          }
        )
        expected_registry='https://registry.npmjs.org/'
        test "$(npm config get registry)" = "$expected_registry"
        npm view "$PACKAGE_NAME" version --registry="$expected_registry" >/dev/null
    - name: Stage through npm trusted publishing
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        NPM_DIST_TAG: ${{ inputs.dist-tag }}
      run: |
        set -euo pipefail
        expected_registry='https://registry.npmjs.org/'
        test "$(npm config get registry)" = "$expected_registry"
        artifact=$(find "$RUNNER_TEMP/stage-target" -maxdepth 1 -name '*.tgz' -type f)
        cd "$GITHUB_WORKSPACE/$PACKAGE_DIR"
        npm stage publish "$artifact" --access public --tag "$NPM_DIST_TAG" --provenance --registry="$expected_registry"
        echo '::notice::Artifact is staged only. A human must inspect it and approve it interactively with npm 2FA; this workflow never approves or promotes a stage.'
